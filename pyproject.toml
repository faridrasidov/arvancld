[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arvancld"
version = "0.1.0"
description = "A typed Python client for ArvanCloud services"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Farid" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arvancld"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

